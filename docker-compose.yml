services:
  postgres:
    image: postgres:16-alpine
    container_name: kit_postgres
    environment:
      POSTGRES_DB: kit_personagens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kit_personagens"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./kit-personagens-api
      dockerfile: Dockerfile
    container_name: kit_api
    ports:
      - "3001:3001"
    env_file:
      - ./kit-personagens-api/.env
    environment:
      PORT: "3001"
      FRONTEND_URL: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kit_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build:
      context: ./kit-personagens-admin
      dockerfile: Dockerfile
    container_name: kit_admin
    ports:
      - "3002:3002"
    env_file:
      - ./kit-personagens-admin/.env.local
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
